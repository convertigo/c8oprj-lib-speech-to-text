↓lib_SpeechToText_ui_ngx [core.Project]: 
  comment: |
    'Offline speech-to-text for NGX apps: Whisper runs in the browser (Web Worker, WebGPU or WebAssembly), the audio never leaves the device.
    
    - speechToText_sc: microphone button giving the provisional text while the user speaks (Partial) and each validated sentence (Final)
    - speechToTextPreload_sa: loads the model in advance
    - speechToTextStop_sa: stops the microphone and waits for the last sentence
    
    The model project lib_SpeechToText_model_whisperBase (every device) comes with this library as a project reference. Deploy lib_SpeechToText_model_whisperSmall (computers with WebGPU) on the same server for better quality, or set the global symbol lib_speechtotext.models.url. Example page: testSpeechToText.'

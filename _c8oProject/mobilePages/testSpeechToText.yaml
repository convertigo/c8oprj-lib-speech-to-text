↓Style [ngx.components.UIStyle-1795539921808]: 
  comment: Layout of the example page
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.demo {
          	max-width: 860px;
          	margin: 0 auto;
          	padding-bottom: 32px;
          }
          
          .demo-intro {
          	padding: 8px 4px 4px;
          }
          
          .demo-intro h1 {
          	margin: 8px 0 6px;
          	font-size: 26px;
          	font-weight: 700;
          }
          
          .demo-intro p {
          	margin: 0 0 8px;
          	color: var(--ion-color-medium, #92949c);
          	line-height: 1.5;
          }
          
          .demo-card {
          	margin: 16px 0;
          	border-radius: 16px;
          }
          
          .demo-settings {
          	display: grid;
          	grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
          	gap: 20px;
          	align-items: start;
          }
          
          @media (max-width: 640px) {
          	.demo-settings {
          		grid-template-columns: minmax(0, 1fr);
          	}
          }
          
          .demo-label {
          	font-size: 12px;
          	margin-bottom: 6px;
          	color: var(--ion-color-medium, #92949c);
          }
          
          .demo-help {
          	margin-top: 6px;
          	font-size: 12px;
          	color: var(--ion-color-medium, #92949c);
          }
          
          .demo-mic {
          	display: flex;
          	justify-content: center;
          	padding: 8px 0 16px;
          }
          
          .demo-transcript {
          	min-height: 96px;
          	padding: 14px 16px;
          	border-radius: 12px;
          	border: 1px solid rgba(127, 127, 127, 0.3);
          	background: rgba(127, 127, 127, 0.06);
          	font-size: 17px;
          	line-height: 1.6;
          	color: var(--ion-text-color, inherit);
          }
          
          .demo-partial {
          	color: var(--ion-color-medium, #92949c);
          	font-style: italic;
          }
          
          .demo-placeholder {
          	color: var(--ion-color-medium, #92949c);
          }
          
          .demo-footer {
          	display: flex;
          	flex-wrap: wrap;
          	align-items: center;
          	justify-content: space-between;
          	gap: 8px;
          	margin-top: 10px;
          }
          
          .demo-chips ion-chip {
          	margin: 0 6px 0 0;
          	font-size: 12px;
          }
          
          .demo-chips ion-chip ion-icon {
          	margin: 0 6px 0 0;
          }
          
          .demo-actions ion-button {
          	margin: 0;
          	text-transform: none;
          }
          
          .demo-field-mic {
          	margin-top: 12px;
          }
          '
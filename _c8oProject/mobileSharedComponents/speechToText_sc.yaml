↓language [ngx.components.UICompVariable-1795533642836]: 
  comment: '<p>Spoken language, as a Whisper language name (''english'', ''french'', ''spanish'', ''german''...); empty to detect it at each pass. Give it when you know it: more reliable and a bit faster</p><p><b>Example:</b> <code>''english''</code></p>'
↓modelsUrl [ngx.components.UICompVariable-1795533642838]: 
  comment: '<p>URL of a folder holding onnx-community/whisper-base/ and onnx-community/whisper-small/. Empty: the model projects lib_SpeechToText_model_whisperBase and lib_SpeechToText_model_whisperSmall deployed on the server of the app</p><p><b>Example:</b> <code>''https://cdn.example.com/models/''</code></p>'
  value: '''${lib_speechtotext.models.url=}'''
↓micProcessing [ngx.components.UICompVariable-1795533642840]: 
  comment: <p>Keep the echo cancellation, noise suppression and automatic gain of the browser on the microphone. Turn it off if words are cut or distorted</p><p><b>Example:</b> <code>true</code></p>
  value: true
↓preload [ngx.components.UICompVariable-1795533642842]: 
  comment: <p>Load the model as soon as the component shows (true), or at the first click (false)</p><p><b>Example:</b> <code>true</code></p>
  value: true
↓showStatus [ngx.components.UICompVariable-1795533642844]: 
  comment: <p>Show the state (loading, listening, errors) next to the button</p><p><b>Example:</b> <code>true</code></p>
  value: true
↓label [ngx.components.UICompVariable-1795533642846]: 
  comment: <p>Text of the button next to the microphone icon; empty for an icon-only button</p><p><b>Example:</b> <code>'Dictate'</code></p>

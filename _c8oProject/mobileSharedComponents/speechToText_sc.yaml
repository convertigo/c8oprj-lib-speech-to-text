comment: |
  'Microphone button for offline speech-to-text: Whisper runs in the browser (Web Worker; WebGPU or WebAssembly), the audio never leaves the device.
  While the user speaks, Partial gives the provisional text of the sentence in progress; after each pause Final gives the validated sentence.
  The model comes from the model projects lib_SpeechToText_model_whisperBase / lib_SpeechToText_model_whisperSmall deployed on the same server, or from modelsUrl.
  One engine per browser tab: every speechToText_sc shares the same model and microphone.'
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        declare var window: any;
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public sttState: any = { status: ''idle'', ready: false, loading: false, listening: false, finishing: false, speaking: false, level: 0, progress: 0, error: '''' };
        	public sttMine: boolean = false;
        	public sttEngine: any = null;
        	private sttOff: any = null;
        	private sttId: string = ''stt-'' + Math.random().toString(36).substring(2);
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		this.sttInit();
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		if (this.sttOff) { this.sttOff(); this.sttOff = null; }
        		if (this.sttEngine && this.sttMine && this.sttState.listening) { this.sttEngine.stop(false); }
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		if (this.sttEngine && this.sttState.ready && (changes[''model''] || changes[''language''] || changes[''modelsUrl''])) {
        			this.sttLoad();
        		}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	// URL of the library files (DisplayObjects/stt of lib_SpeechToText_ui_ngx) on the Convertigo server of the app
        	public sttLibUrl(): string {
        		const path = ''/projects/lib_SpeechToText_ui_ngx/DisplayObjects/stt/'';
        		const b = document.baseURI, i = b.indexOf(''/projects/'');
        		if (i > 0) { return b.substring(0, i) + path; }
        		const ep: string = (this as any).c8o?.endpointConvertigo || '''';
        		return /^https?:/.test(ep) ? ep + path : new URL(''../../lib_SpeechToText_ui_ngx/DisplayObjects/stt/'', b).href;
        	}
        
        	public sttOptions(): any {
        		return { model: this[''model''] || ''auto'', language: this[''language''] || '''', modelsUrl: this[''modelsUrl''] || '''', micProcessing: this[''micProcessing''] !== false && this[''micProcessing''] !== ''false'' };
        	}
        
        	private sttRefresh() {
        		const ref: any = (this as any).ref;
        		try { ref?.markForCheck?.(); ref?.detectChanges?.(); } catch (e) { }
        	}
        
        	private async sttInit() {
        		try {
        			const url = this.sttLibUrl() + ''stt-engine.js'';
        			const mod: any = await import(/* @vite-ignore */ /* webpackIgnore: true */ url);
        			this.sttEngine = mod.speechToText();
        			this.sttOff = this.sttEngine.on((e: any) => this.sttOnEvent(e));
        			if (this[''preload''] !== false && this[''preload''] !== ''false'') { this.sttLoad(); }
        		} catch (e) {
        			this.sttState = { ...this.sttState, status: ''error'', error: ''Cannot load lib_SpeechToText_ui_ngx from '' + this.sttLibUrl() + '': '' + (e?.message || e) };
        			this[''Error''].emit(this.sttState.error);
        			this.sttRefresh();
        		}
        	}
        
        	private sttLoad() {
        		this.sttEngine.load(this.sttOptions()).catch(() => { /* reported by the error event */ });
        	}
        
        	private sttOnEvent(e: any) {
        		switch (e.type) {
        			case ''state'':
        				this.sttState = e.state;
        				this.sttMine = e.state.owner === this.sttId;
        				this[''StateChanged''].emit(e.state);
        				break;
        			case ''ready'':
        				this[''Ready''].emit({ model: e.model, device: e.device, reason: e.reason, loadMs: e.loadMs });
        				break;
        			case ''partial'':
        				if (e.owner === this.sttId) { this[''Partial''].emit(e.text); }
        				break;
        			case ''final'':
        				if (e.owner === this.sttId && e.text) { this[''Final''].emit(e.text); }
        				break;
        			case ''done'':
        				if (e.owner === this.sttId) { this[''Done''].emit(true); }
        				break;
        			case ''stats'':
        				this[''Stats''].emit({ kind: e.kind, ms: e.ms, audioS: e.audioS });
        				break;
        			case ''error'':
        				if (!e.owner || e.owner === this.sttId) { this[''Error''].emit(e.message); }
        				break;
        		}
        		this.sttRefresh();
        	}
        
        	// Starts or stops the microphone (the button calls it; also usable from a page through a ViewChild)
        	public async sttToggle() {
        		if (!this.sttEngine) { return; }
        		if (this.sttState.listening && this.sttMine) {
        			this.sttEngine.stop(false);
        			return;
        		}
        		try {
        			await this.sttEngine.start(this.sttId, this.sttOptions());
        		} catch (e) { /* reported by the error event */ }
        	}
        
        	public sttActive(): boolean {
        		return this.sttState.listening && this.sttMine;
        	}
        
        	public sttBusy(): boolean {
        		const s = this.sttState;
        		return !this.sttEngine || s.loading || (s.finishing && this.sttMine) || (s.status === ''error'' && !s.ready);
        	}
        
        	// width of the level meter, from the voice level the worker measures
        	public sttLevel(): string {
        		return ''scaleX('' + (this.sttActive() ? Math.max(0.03, Math.min(1, this.sttState.level || 0)) : 0) + '')'';
        	}
        
        	public sttStatusText(): string {
        		const s = this.sttState;
        		if (s.error && s.status === ''error'') { return s.error; }
        		if (s.loading) { return ''Loading the speech model… '' + (s.progress || 0) + '' %''; }
        		if (this.sttActive()) { return s.speaking ? ''Listening…'' : ''Waiting for speech…''; }
        		if (s.finishing && this.sttMine) { return ''Transcribing…''; }
        		if (s.listening) { return ''Microphone in use by another field''; }
        		return s.ready ? ''Ready'' : '''';
        	}
        	/*End_c8o_CompFunction*/
        '
